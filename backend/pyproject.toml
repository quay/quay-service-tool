[project]
name = "quay-service-tool"
version = "0.0.1"
requires-python = "==3.15.*"
dependencies = [
    "boto3>=1.35,<2",
    "quay @ git+https://github.com/quay/quay.git@b2bd5926e036a2c3db27dea062eb2f24b911ac4e",
    "python-keycloak>=4.0.0",
    "prometheus-flask-exporter==0.23.1",
    "psycopg2-binary>=2.9.10",
    "supervisor==4.3.0",
    "gunicorn>=23.0.0",
    "gevent>=24.0.0",
    "python-redis-lock>=4.0.0",
]

[tool.uv]
package = false
override-dependencies = [
    "svglib==1.5.1", # this is needed otherwise Quay will try to install pycairo which doesn't work in Ubi
    "pyjwt>=2.15.0",
    "jwcrypto>=1.5.7",
    "supervisor==4.3.0",
    "prometheus-client>=0.13.1",
    "authlib>=1.9.0",
    "pyasn1>=0.6.5",
    "certifi>=2026.10.19", # GHSA-6q48-6c7w-9gw2: distrust eMudhra intermediate CAs, fixed in 2026.10.19
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
