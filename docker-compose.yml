networks:
  default:
    external: true
    name: quay_default

services:
  quay-service-tool-state-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: service_tool_spam
      POSTGRES_USER: spam
      POSTGRES_PASSWORD: spam-local
    volumes:
      - spam-detection-postgres:/var/lib/postgresql/data
    ports:
      - '${SERVICE_TOOL_STATE_DB_PORT:-55432}:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spam -d service_tool_spam"]
      interval: 2s
      timeout: 3s
      retries: 30

  quay-service-tool-s3:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - spam-detection-s3:/data
    ports:
      - '${SERVICE_TOOL_S3_PORT:-9002}:9000'
      - '${SERVICE_TOOL_S3_CONSOLE_PORT:-9003}:9001'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

#  Not needed for local development
#  quay-service-tool-auth:
#    container_name: "quay-service-tool-auth"
#    image: jboss/keycloak
#    ports:
#      - '8081:8080'
#    environment:
#      - KEYCLOAK_USER=admin
#      - KEYCLOAK_PASSWORD=password

  quay-service-tool-api:
    container_name: "quay-service-tool-api"
    build:
      context: .
      target: backend-dev
    # these are mounted explicitly since mounting all of backend/ will clobber the
    # virtual environment created by `uv` during the image build
    volumes:
      - ./backend/app.py:/backend/app.py
      - ./backend/_init.py:/backend/_init.py
      - ./backend/utils.py:/backend/utils.py
      - ./backend/tasks:/backend/tasks
      - ./backend/templates:/backend/templates
      - ./backend/config:/backend/config
      - ./backend/tests:/backend/tests
    ports:
      - '5000:5000'
    environment:
      ENV: development
      DEBUG: "True"
      PYTHONUNBUFFERED: "True"
      CONFIG_PATH: /backend/config
      SPAM_DETECTION_STATE_DB_URI: postgresql://spam:spam-local@quay-service-tool-state-db:5432/service_tool_spam
      SPAM_DETECTION_ARTIFACT_STORAGE: s3
      SPAM_DETECTION_S3_ENDPOINT_URL: http://quay-service-tool-s3:9000
      SPAM_DETECTION_S3_BUCKET: quay-service-tool
      SPAM_DETECTION_S3_PREFIX: spam-detection
      SPAM_DETECTION_S3_REGION: us-east-1
      SPAM_DETECTION_S3_ADDRESSING_STYLE: path
      SPAM_DETECTION_S3_VERIFY_TLS: "false"
      SPAM_DETECTION_S3_CREATE_BUCKET: "true"
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      IS_LOCAL: "True"
    depends_on:
      quay-service-tool-state-db:
        condition: service_healthy
      quay-service-tool-s3:
        condition: service_healthy

  quay-service-tool-client:
    container_name: "quay-service-tool-client"
    build:
      context: .
      target: frontend-dev
    volumes:
      - ./frontend/src:/frontend/src
      - ./frontend/webpack.common.js:/frontend/webpack.common.js
      - ./frontend/webpack.dev.js:/frontend/webpack.dev.js
    ports:
      - '9000:9000'
    depends_on:
      - quay-service-tool-api
    env_file:
      - ./frontend/.env
    environment:
      NODE_ENV: development
      TARGET_URL: http://quay-service-tool-api:5000

volumes:
  spam-detection-postgres:
  spam-detection-s3:
